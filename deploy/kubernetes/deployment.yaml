apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmgateway
  namespace: llmproxy
  labels:
    app: llmgateway
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: llmgateway
  template:
    metadata:
      labels:
        app: llmgateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: llmgateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: llmgateway
        image: llmgateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        
        - name: PRICE_CATALOG_PATH
          value: "/config/price-catalog.json"
        - name: TRACING_ENABLED
          value: "true"
        - name: JAEGER_ENDPOINT
          value: "http://jaeger-collector:14268/api/traces"
        
        - name: JOB_TTL_SECONDS
          value: "3600"
        - name: MAX_JOB_WORKERS
          value: "10"
        - name: CIRCUIT_BREAKER_MAX_FAILURES
          value: "5"
        - name: CIRCUIT_BREAKER_TIMEOUT_SECONDS
          value: "60"
        
        - name: SLO_WINDOW_HOURS
          value: "24"
        - name: COST_SPIKE_THRESHOLD
          value: "2.0"
        
        - name: COALESCING_ENABLED
          value: "true"
        - name: COALESCING_TIMEOUT_SECONDS
          value: "30"
        - name: SEMANTIC_CACHE_ENABLED
          value: "true"
        - name: SEMANTIC_CACHE_THRESHOLD
          value: "0.95"
        - name: SEMANTIC_CACHE_MAX_SIZE
          value: "10000"
        - name: ROUTING_STRATEGY
          value: "balanced"
        
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: llmgateway-secrets
              key: encryption-key
        - name: RATE_LIMIT_STRATEGY
          value: "token_bucket"
        
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llmgateway-secrets
              key: openai-api-key
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llmgateway-secrets
              key: gemini-api-key
        - name: MISTRAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: llmgateway-secrets
              key: mistral-api-key
        - name: CLAUDE_API_KEY
          valueFrom:
            secretKeyRef:
              name: llmgateway-secrets
              key: claude-api-key
        - name: VERTEX_AI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llmgateway-secrets
              key: vertex-ai-api-key
              optional: true
        - name: VERTEX_AI_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: llmgateway-secrets
              key: vertex-ai-project-id
              optional: true
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: llmgateway-secrets
              key: aws-access-key-id
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: llmgateway-secrets
              key: aws-secret-access-key
              optional: true
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30
        
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: config
        configMap:
          name: llmgateway-config
      - name: tmp
        emptyDir: {}
      
      terminationGracePeriodSeconds: 60
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - llmgateway
              topologyKey: kubernetes.io/hostname
