apiVersion: v1
kind: ServiceAccount
metadata:
  name: llmgateway
  namespace: llmproxy
  labels:
    app: llmgateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmgateway
  namespace: llmproxy
  labels:
    app: llmgateway
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmgateway
  namespace: llmproxy
  labels:
    app: llmgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmgateway
subjects:
- kind: ServiceAccount
  name: llmgateway
  namespace: llmproxy
